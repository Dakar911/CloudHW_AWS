apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagegrab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagegrab
  template:
    metadata:
      labels:
        app: imagegrab
    spec:
      containers:
      - name: imagegrab
        image: imagegrab:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
          - name: REDIS_HOST
            value: "redis"
          - name: REDIS_PORT
            value: "6379"
          - name: MINIO_ENDPOINT
            value: "minio:9000"
          - name: MINIO_ACCESS_KEY
            value: "minioadmin"
          - name: MINIO_SECRET_KEY
            value: "minioadmin"
          - name: MINIO_BUCKET
            value: "images"
---
apiVersion: v1
kind: Service
metadata:
  name: imagegrab
spec:
  selector:
    app: imagegrab
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort