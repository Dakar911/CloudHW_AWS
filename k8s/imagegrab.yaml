apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagegrab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagegrab
  template:
    metadata:
      labels:
        app: imagegrab
    spec:
      containers:
      - name: imagegrab
        image: imagegrab:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: imagegrab
spec:
  selector:
    app: imagegrab
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort